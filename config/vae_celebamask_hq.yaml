model_params:
  name: "VanillaVAE"
  in_channels: 3
  latent_dim: 256
  hidden_dims: [16, 32, 64, 128, 256, 512]

data_params:
  dataset: "celebamask_hq"
  data_path: "/mnt/ext-data-01/data"
  train_batch_size: 64
  val_batch_size: 64
  patch_size: 128
  num_workers: 4

exp_params:
  LR: 0.005
  weight_decay: 0.0
  scheduler_gamma: 0.95
  kld_weight: 0.00025
  manual_seed: 1265

trainer_params:
  devices: 1
  strategy: "ddp"
  max_epochs: 100

logging_params:
  save_dir: "logs/"
  name: "VanillaVAE"
