model_params:
  name: "FlowVAE"
  in_channels: 3
  in_size: 64
  latent_dim: 256
  base_dim: 16
  scale: 4
  num_blocks: 1
  residual: True
  bottleneck: False
  weight_norm: True
  flow_type: nice
  flow_length: 8
  kld_weight: 0.00025
  lpips_weight: 0.15

data_params:
  dataset: "celeba"
  data_path: "/mnt/ext-data-01/data"
  train_batch_size: 64
  val_batch_size: 64
  patch_size: 64
  num_workers: 8
  pin_memory: True

exp_params:
  LR: 0.005
  weight_decay: 0.0
  scheduler_gamma: 0.95
  manual_seed: 1265

trainer_params:
  devices: 1
  strategy: "ddp"
  max_epochs: 100

logging_params:
  save_dir: "logs/"
  name: "FlowVAE"
