model_params:
  name: "ConditionedVAE"
  latent_dim: 32
  identity_model_path: "magface_r18.pth"
  loss_type: H
  gamma: 10
  max_capacity: 50
  C_stop_iter: 100000
  encoder:
    in_channels: 3
    in_size: 64
    base_dim: 8
    scales: 4
    num_blocks: 1
    channel_multiplier: 2
    min_spatial: 4
    residual: True
    bottleneck: True
    weight_norm: False
    norm: "layer"
    activation: "silu"
  decoder:
    out_channels: 3
    scales: 4
    num_blocks: 1
    channel_multiplier: 0.5
    residual: True
    bottleneck: True
    weight_norm: False
    norm: "layer"
    activation: "silu"
    final_activation: "sigmoid"

data_params:
  dataset: "celeba"
  data_path: "/mnt/ext-data-01/data"
  train_batch_size: 64
  val_batch_size: 64
  patch_size: 64
  num_workers: 4
  pin_memory: True

experiment_params:
  optim1:
    lr: 0.0005
    weight_decay: 0.0
    warmup_epochs: 5
    warmup_start_lr: 0.00005
    eta_min: 0.00005
  manual_seed: 1265
  max_epochs: 100

trainer_params:
  devices: 1
  strategy: "ddp"
  precision: "32-true"
  gradient_clip_val: 1
  gradient_clip_algorithm: value

logging_params:
  save_dir: "logs/"
  name: "ConditionedVAE"
